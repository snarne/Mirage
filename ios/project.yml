# The iPhone app's Xcode project, generated rather than committed.
#
#     ./scripts/gen-xcodeproj.sh
#
# A .xcodeproj is a merge-hostile pile of UUIDs, and this project has to be re-signed
# every seven days by whoever builds it, so the parts that differ per person — the team,
# the bundle prefix — are environment variables with workable defaults.
#
#   BUNDLE_ID_PREFIX   default app.mirage. Change it if someone else already has that.
#   DEVELOPMENT_TEAM   your ten-character Team ID, or empty to pick it in Xcode.
#
# The Swift engine comes in as a local package (../ui). The Rust bridge does not: its
# sources are compiled straight into the app and the static library is linked by path,
# which keeps the package free of the build flags that would otherwise leak into every
# consumer of it.

name: Mirage
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    # Swift 5 language mode on purpose. MirageKit is built in Swift 6 mode by its own
    # manifest, where the strictness is worth it; SwiftUI view code gains little from it
    # and loses a lot of legibility to isolation annotations.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Where `./scripts/build-native.sh --ios` leaves the Rust bridge, and where the
    # CMirageIdevice module map lives so `import CMirageIdevice` resolves.
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../native/mirage-idevice/target/aarch64-apple-ios/release
    SWIFT_INCLUDE_PATHS:
      - $(inherited)
      - $(SRCROOT)/../ui/Sources/CMirageIdevice

packages:
  Mirage:
    path: ../ui

targets:
  Mirage:
    type: application
    platform: iOS
    # Without this, editing the Rust and pressing Run in Xcode silently links whatever
    # .a was lying around — and the app fails later with an error message that no longer
    # exists in the source, which is a genuinely confusing place to end up.
    preBuildScripts:
      - name: Build the Rust bridge
        script: "\"$SRCROOT/../scripts/build-native.sh\" --ios"
        basedOnDependencyAnalysis: false
    sources:
      - path: Mirage
      - path: Shared
      # The Rust bridge, compiled in rather than imported. See the note above.
      - path: ../ui/Sources/MirageDevice
        name: MirageDevice
      # Shared with the Mac app rather than copied. Both are plain MapKit and neither
      # knows which platform it is on; keeping one copy is the only way the two apps stay
      # honest about routing the same way.
      - path: ../ui/Sources/Mirage/RouteService.swift
        group: Shared with the Mac
      - path: ../ui/Sources/Mirage/AddressCompleter.swift
        group: Shared with the Mac
    dependencies:
      - package: Mirage
        product: MirageKit
      - target: MirageWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.ios
        PRODUCT_NAME: Mirage
        INFOPLIST_FILE: Mirage/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # The static library is named by the module map's `link` directive, so no
        # -lmirage_idevice is needed here.
        OTHER_LDFLAGS:
          - $(inherited)

  MirageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MirageWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.ios.widgets
        PRODUCT_NAME: MirageWidgets
        INFOPLIST_FILE: MirageWidgets/Info.plist
        # The extension draws the Live Activity and nothing else. It never touches the
        # device, so it links none of the bridge.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)

# Without this, Xcode invents a scheme per target on first open and may well select the
# widget extension — which cannot be launched, and fails with a SpringBoard error that
# looks far more alarming than "wrong scheme selected". One named scheme, which builds
# the app and carries the extension inside it.
schemes:
  Mirage:
    build:
      targets:
        Mirage: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
